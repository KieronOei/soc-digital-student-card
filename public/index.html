<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Student Card Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🎓 Digital Student Card Generator</h1>
        <p>Create your digital student card for Apple & Google Wallet</p>
      </header>

      <main>
        <div class="card">
          <h2>Enter Your Information</h2>
          <form id="studentForm">
            <div class="form-group">
              <label for="studentId">Student ID *</label>
              <input
                type="text"
                id="studentId"
                name="studentId"
                required
                placeholder="S12345678"
              />
            </div>

            <div class="form-group">
              <label for="career">Career *</label>
              <input
                type="text"
                id="career"
                name="career"
                required
                placeholder="Undergraduate"
              />
            </div>

            <div class="form-group">
              <label for="admitTerm">Admit Term *</label>
              <input
                type="text"
                id="admitTerm"
                name="admitTerm"
                required
                placeholder="2023/2024 Semester 1"
              />
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
              Generate Student Card
            </button>
          </form>
        </div>

        <div id="result" class="result-card" style="display: none">
          <h2>✅ Student Card Created!</h2>
          <p>Your digital student card has been generated successfully.</p>

          <div class="wallet-buttons">
            <a
              id="googleWalletBtn"
              href="#"
              class="btn btn-google"
              target="_blank"
            >
              <img
                src="https://developers.google.com/static/wallet/images/add-to-google-wallet-button.svg"
                alt="Add to Google Wallet"
                style="height: 50px"
              />
            </a>

            <div class="coming-soon">
              <button class="btn btn-apple" disabled>
                Add to Apple Wallet (Coming Soon)
              </button>
            </div>
          </div>

          <div class="pass-info">
            <p><strong>Pass ID:</strong> <span id="passId"></span></p>
          </div>
        </div>

        <div id="error" class="error-card" style="display: none">
          <h2>❌ Error</h2>
          <p id="errorMessage"></p>
        </div>
      </main>

      <footer>
        <p>Secure • Digital</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
